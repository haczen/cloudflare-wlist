name: Release

# 打 tag（v*）即发布：构建校验 + 创建 GitHub Release（自动生成变更说明）
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## WList ${{ github.ref_name }}

            Cloudflare Workers 上的多网盘聚合存储中心。

            ### 部署
            见 [README](https://github.com/${{ github.repository }}#快速部署) —— fork 后配置 Secrets 即可，约 5 分钟。

            ### 完整变更
            自动生成于下方。
