name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate wrangler.jsonc from template
        run: |
          node -e "
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc.example', 'utf8'));
          const dbId = process.env.DATABASE_ID;
          if (!dbId || dbId.startsWith('00000000')) {
            console.error('DATABASE_ID variable is not configured in repo settings');
            process.exit(1);
          }
          cfg.d1_databases[0].database_id = dbId;
          if (process.env.ADMIN_PASSWORD) cfg.vars.ADMIN_PASSWORD = process.env.ADMIN_PASSWORD;
          if (process.env.WEBDAV_PASSWORD) cfg.vars.WEBDAV_PASSWORD = process.env.WEBDAV_PASSWORD;
          if (process.env.GITHUB_CLIENT_ID) cfg.vars.GITHUB_CLIENT_ID = process.env.GITHUB_CLIENT_ID;
          if (process.env.GITHUB_CLIENT_SECRET) cfg.vars.GITHUB_CLIENT_SECRET = process.env.GITHUB_CLIENT_SECRET;
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(cfg, null, '\t'));
          console.log('wrangler.jsonc generated for database ' + dbId);
          "
        env:
          DATABASE_ID: ${{ vars.DATABASE_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}

      - name: Install dependencies
        run: npm ci

      - name: Build & deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
